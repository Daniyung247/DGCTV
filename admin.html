<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DGC TV News Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">DGC <span>TV NEWS</span></a><a href="/">View website</a></header><main><h1>Newsroom dashboard</h1><p id="message" class="message">Configure Supabase to start.</p><section id="login" class="panel"><h2>Administrator sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="dashboard" class="hidden"><div class="row"><h2>Create / edit article</h2><button id="logout" type="button">Sign out</button></div><form id="editor" class="panel"><input id="id" type="hidden"><label>Headline<input id="title" maxlength="180" required></label><label>Slug<input id="slug" maxlength="180" required></label><label>Summary<textarea id="summary" maxlength="350" required></textarea></label><label>Category<select id="category"><option>News</option><option>Entertainment</option><option>Sports</option><option>Jobs</option><option>Education</option><option>Lifestyle</option><option>Technology</option><option>Business</option><option>Politics</option><option>Health</option></select></label><label>Author<input id="author" value="DGC TV Editorial Desk" required></label><label>Article body<textarea id="body" rows="12" required></textarea></label><label>Featured image (JPEG, PNG or WebP, max 5 MB)<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Image alt text<input id="alt" maxlength="250"></label><label>Current image URL<input id="imageUrl" readonly></label><div class="row"><button type="button" id="saveDraft">Save draft</button><button type="button" id="publish">Publish article</button><button type="button" id="reset">New article</button></div></form><h2>Articles</h2><div id="list"></div></section><section class="panel"><h3>Security reminder</h3><p>Only user IDs manually added to <code>public.admins</code> can publish. Never place a Supabase service-role key in browser code.</p></section></main><footer><a href="/">DGC TV</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/admin.js"></script></body></html>
